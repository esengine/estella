name: Engine render host from this run's engine
description: Build the engine's headless render host against the wasm this run produced.

# Every job that measures pixels needs the same three steps between the artifact
# and a runnable host. More than one does, and a second copy of them is a copy
# that drifts — one job would end up measuring an engine the other never built.
runs:
  using: composite
  steps:
    - name: Download web wasm artifact
      uses: actions/download-artifact@v8
      with:
        name: wasm-web
        path: build/wasm/web/

    - name: Build SDK
      shell: bash
      run: pnpm --filter ./sdk build

    - name: Build the render host
      shell: bash
      run: node tools/render-host/build.mjs
