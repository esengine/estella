name: Build

# Push-gated CI: every master push must keep the architecture invariants green —
# boundary guards, full-component ABI static_asserts (compiled by the web build),
# the C++ doctest harnesses, and both TS suites. workflow_dispatch stays for
# re-runs and branch experiments.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only reads the repo and moves artifacts (the
# artifact API runs on its own runtime token, not contents). Nothing here writes
# to the repo, so the default read-all token is narrowed to contents:read.
permissions:
  contents: read

# Single source of truth for the C++ doctest harnesses: every job's build-target
# list and run loop derives from it, so a new harness can no longer be compiled-
# but-never-run (the hand-kept lists had drifted).
env:
  CPP_TESTS: >-
    test_ecs test_events test_particle test_tilemap test_sparse_set
    test_resource_pool test_shader_variant test_log_format test_registry_safety
    test_registry_ondestroy test_view_api_matrix
    test_shader_device test_draw_params test_texture_fb test_buffer_device
    test_compressed_format test_batch_builder test_boundary_span test_webgpu_device
    test_text_edit

jobs:
  build-emscripten:
    name: Web (Emscripten) + C++ tests
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - uses: ./.github/actions/setup

    - name: Setup Emscripten
      uses: mymindstorm/setup-emsdk@v16
      with:
        version: 5.0.0

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2.23
      with:
        key: ${{ runner.os }}-emscripten
        max-size: 500M

    - name: Build Web target
      run: node build-tools/cli.js build -t web --no-sync

    - name: Build WeChat target
      run: node build-tools/cli.js build -t wechat --no-sync

    - name: Verify build outputs
      run: |
        test -f build/wasm/web/esengine.js && echo "✓ Web JS"
        test -f build/wasm/web/esengine.wasm && echo "✓ Web WASM"
        test -f build/wasm/wechat/esengine.wxgame.js && echo "✓ WeChat JS"
        test -f build/wasm/wechat/esengine.wxgame.wasm && echo "✓ WeChat WASM"

    - name: Build C++ test harnesses
      run: |
        emcmake cmake -S . -B build/wasm/web-tests -DCMAKE_BUILD_TYPE=Release -DES_BUILD_WEB=ON -DES_BUILD_TESTS=ON
        # webgpu_engine_bringup is compiled (a link-time smoke) but not run below.
        cmake --build build/wasm/web-tests -j "$(nproc)" --target $CPP_TESTS webgpu_engine_bringup

    # The root package.json is ESM, so the emscripten-emitted .js must run as .cjs.
    - name: Run C++ test harnesses
      run: |
        for t in $CPP_TESTS; do
          cp "build/wasm/web-tests/bin/$t.js" "build/wasm/web-tests/bin/$t.cjs"
          echo "=== $t"
          node "build/wasm/web-tests/bin/$t.cjs"
        done

    # No --continue-on-error: a side-module compile break must FAIL the gate.
    # It used to be swallowed here, so a physics-module error lived on master
    # for days and only surfaced when a release ran `build -t all` for real.
    - name: Build remaining targets (spine, physics)
      run: node build-tools/cli.js build -t all --no-sync

    - name: Upload web wasm artifact
      uses: actions/upload-artifact@v7
      with:
        name: wasm-web
        path: build/wasm/web/
        retention-days: 3

  # The same harnesses, instrumented. An out-of-bounds read that lands in
  # allocation slack (or in the next allocation) is silent in the plain build and
  # is exactly what these gates cannot otherwise see. Findings are fatal —
  # ES_SANITIZE passes -fno-sanitize-recover, or UBSan would print and continue.
  sanitizers:
    name: C++ tests (ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Setup Emscripten
      uses: mymindstorm/setup-emsdk@v16
      with:
        version: 5.0.0

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2.23
      with:
        key: emscripten-asan

    - name: Configure (ASan + UBSan)
      run: |
        emcmake cmake -S . -B build/wasm/asan -DCMAKE_BUILD_TYPE=Debug \
          -DES_BUILD_WEB=ON -DES_BUILD_TESTS=ON -DES_SANITIZE=ON

    - name: Build C++ test harnesses
      run: cmake --build build/wasm/asan -j "$(nproc)" --target $CPP_TESTS

    - name: Run C++ test harnesses
      run: |
        for t in $CPP_TESTS; do
          cp "build/wasm/asan/bin/$t.js" "build/wasm/asan/bin/$t.cjs"
          echo "=== $t"
          node "build/wasm/asan/bin/$t.cjs"
        done

  test:
    name: Tests (SDK + Desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/setup

    - name: Check GL boundary (no gl* outside GLDevice)
      run: node tools/check-gl-boundary.mjs

    - name: Check render-command boundary (DrawCommands built only by BatchBuilder)
      run: node tools/check-draw-command-boundary.mjs

    # The release path has no pull request to fail on, so a workflow step that
    # cannot run is found by pushing a tag. Checked here, where every push is.
    - name: Check workflows (tooling steps install the workspace)
      run: node tools/check-workflows.mjs

    # The device build's codegen, without the device build: it needs no compiler
    # and takes a second, but nothing outside a release ran it — so a header that
    # moved cost a full Dawn build to find out about, twice.
    - name: Check native binding codegen (headers + the includes it generates)
      run: node tools/check-native-bindings.mjs

    # Filtered so the SDK is checked by ITS OWN pinned TypeScript (the workspace
    # carries two majors — desktop is on 6.x); a bare root `pnpm exec tsc`
    # resolves an arbitrary compiler. Mirrors the repo's `verify` gate exactly.
    - name: Type-check SDK
      run: pnpm --filter ./sdk exec tsc --noEmit

    - name: Check API surface (snapshot + release-tag policy)
      run: node tools/api-surface.mjs --check

    - name: Build SDK
      run: pnpm --filter ./sdk build

    # The snapshot above is read out of the sources, so it says nothing about what
    # the declaration build actually emitted. This is the only step that looks at
    # the .d.ts a consumer installs.
    - name: Check built declarations carry the API surface
      run: node tools/api-surface.mjs --check-dts

    - name: Type-check Examples
      run: node build-tools/cli.js check-examples

    - name: Validate prefab assets
      run: node build-tools/cli.js validate-prefabs

    - name: Run SDK tests
      run: pnpm --filter ./sdk exec vitest run

    - name: Type-check Desktop
      run: pnpm --filter @estella/editor exec tsc --noEmit

    # The Android packaging tests check what we write against implementations that
    # are not ours. androguard decodes the binary manifest; bundletool is the App
    # Bundle format's own authority, and the runner has the JVM it needs — the
    # tests fall back to structural checks where either is absent, so this is the
    # one place they run in full.
    - name: Set up the Android packaging oracles
      run: |
        pip install --quiet androguard
        curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" \
          https://github.com/google/bundletool/releases/download/1.15.6/bundletool-all-1.15.6.jar
        echo "BUNDLETOOL_JAR=$RUNNER_TEMP/bundletool.jar" >> "$GITHUB_ENV"

    - name: Run Desktop tests
      run: pnpm --filter @estella/editor exec vitest run

  # The engine-coupled half of both suites. 25 test files load the built wasm and
  # `skipIf` themselves out when it is absent — which, in a job that never built
  # or downloaded one, meant they had never run in CI at all. They reported as
  # skipped, the run reported success, and a scene-order regression could only be
  # noticed by whoever happened to have a stale local build.
  #
  # Separate from `test` on purpose: type-checks and the pure-TS suites are the
  # fast feedback on a push, and making them wait for Emscripten would trade a
  # real gap for a slower one. ESTELLA_REQUIRE_WASM makes the skip an error here,
  # so if the artifact ever stops arriving this fails instead of going quiet again.
  test-engine:
    name: Tests (engine-coupled)
    runs-on: ubuntu-latest
    needs: build-emscripten
    # Room for the benchmark sweep at the end: ~3 min on a fast laptop, and this
    # runner has two cores.
    timeout-minutes: 40

    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/setup

    - name: Download web wasm artifact
      uses: actions/download-artifact@v8
      with:
        name: wasm-web
        path: build/wasm/web/

    - name: Build SDK
      run: pnpm --filter ./sdk build

    - name: Run SDK tests (engine-coupled)
      env:
        ESTELLA_REQUIRE_WASM: '1'
      run: pnpm --filter ./sdk exec vitest run

    - name: Run Desktop tests (engine-coupled)
      env:
        ESTELLA_REQUIRE_WASM: '1'
      run: pnpm --filter @estella/editor exec vitest run

    # The performance counterpart of the API-surface snapshot, and it belongs in
    # this job for the same reason the job exists: it needs the built wasm, and
    # its own failure mode is a benchmark that quietly stops measuring. Asserts
    # ratios between benchmarks in one run, so the runner's speed cancels out.
    - name: Check performance snapshot
      env:
        ESENGINE_WASM_DIR: ${{ github.workspace }}/build/wasm/web
      run: node tools/perf-guard.mjs --check

  # The other half of the performance contract: ceilings on whole operations at a
  # size no example reaches. Its own job because it generates a 50,000-asset
  # project first, and because a measurement sharing a runner with a test suite is
  # measuring the test suite. See bench/scale/README.md.
  scale:
    name: Scale budgets (50k assets)
    runs-on: ubuntu-latest
    needs: build-emscripten
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/setup

    - name: Download web wasm artifact
      uses: actions/download-artifact@v8
      with:
        name: wasm-web
        path: build/wasm/web/

    # The scale suite loads the SHIPPED bundle (`esengine/node`), not src — a
    # probe tree-shaking drops from dist is one the users' engine does not have.
    - name: Build SDK
      run: pnpm --filter ./sdk build

    - name: Generate the corpus and check the budgets
      env:
        ESENGINE_WASM_DIR: ${{ github.workspace }}/build/wasm/web
      run: node tools/perf-budget.mjs

    # Every run's numbers, kept whether it passed or failed: a budget says what is
    # allowed, and the report is the only record of where a cost actually sits.
    - name: Upload the scale report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: scale-report
        path: build/scale-report.json
        if-no-files-found: warn

  # Headless pixel verification: real scenes rendered by the editor's electron
  # host under xvfb (SwiftShader WebGL), asserted pixel-by-pixel.
  verify-render:
    name: Render verify (headless)
    runs-on: ubuntu-latest
    needs: build-emscripten
    timeout-minutes: 40

    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/setup

    - name: Download web wasm artifact
      uses: actions/download-artifact@v8
      with:
        name: wasm-web
        path: build/wasm/web/

    - name: Build SDK
      run: pnpm --filter ./sdk build

    - name: Stage wasm for the editor host
      run: |
        mkdir -p desktop/public/wasm
        cp build/wasm/web/* desktop/public/wasm/

    - name: Build editor renderer bundle
      working-directory: desktop
      run: pnpm exec vite build

    # Twin coverage guard: every fixture AND example .esshader must carry its
    # WGSL twin (hand-written, generated, or switch-skipped) — a twin-less shader
    # is WebGPU-dead by design and gen-shader-twins --check exits 1 on it. Covers
    # examples/ too so a shipped user shader can never regress to WebGL-only.
    - name: Check shader twins
      run: node tools/gen-shader-twins.mjs --check $(find desktop/public/scenes examples -name '*.esshader')

    # Pipeline smoke: strip a fixture's twins into a temp copy and require the
    # vendored converters (glslang wasm + naga WASI wasm) to produce one —
    # exercises the whole GLSL→SPIR-V→WGSL chain on every CI run.
    - name: Shader-twin pipeline smoke
      run: |
        tmp=$(mktemp -d)
        sed '/#pragma vertex wgsl/,$d' desktop/public/scenes/mat-tint/tint.esshader > "$tmp/smoke.esshader"
        if node tools/gen-shader-twins.mjs --check "$tmp/smoke.esshader"; then
          echo "expected would-generate (exit 1) for a twin-less shader"; exit 1
        fi

    - name: Run headless verify scenes
      working-directory: desktop
      env:
        # CI runners can't use the SUID sandbox helper (not root-owned in
        # node_modules); rendering verification doesn't need it.
        ELECTRON_DISABLE_SANDBOX: '1'
      run: |
        run_scene() {
          echo "=== $1"
          shift
          env "$@" xvfb-run -a pnpm exec electron scripts/headless-verify.mjs
        }
        run_scene sprite-default
        # Editor grid on/off pixel diff — guards the custom-draw reflected
        # material path (drawMeshWithMaterial + MaterialConstants UBO).
        run_scene editor-grid ESTELLA_VERIFY_GRID=64 ESTELLA_VERIFY_STEPS=3
        run_scene mesh2d \
          ESTELLA_VERIFY_SCENE=/scenes/mesh2d.esscene \
          ESTELLA_VERIFY_MANIFEST=/scenes/mesh2d.textures.json \
          ESTELLA_VERIFY_W=256 ESTELLA_VERIFY_H=256 ESTELLA_VERIFY_STEPS=4 \
          'ESTELLA_VERIFY_EXPECT=[{"x":0.30,"y":0.556,"rgb":[255,0,0],"tol":40},{"x":0.70,"y":0.556,"rgb":[0,255,0],"tol":40},{"x":0.30,"y":0.40,"rgb":[255,0,0],"tol":40}]'
        run_scene parallax-shape \
          ESTELLA_VERIFY_SCENE=/scenes/parallax-shape.esscene \
          ESTELLA_VERIFY_MANIFEST=/scenes/parallax-shape.textures.json \
          ESTELLA_VERIFY_STEPS=4 \
          'ESTELLA_VERIFY_EXPECT=[{"x":0.5,"y":0.5,"rgb":[0,255,0],"tol":40},{"x":0.25,"y":0.5,"rgb":[255,0,0],"tol":40}]'
        run_scene tilemap-flip \
          ESTELLA_VERIFY_SCENE=/scenes/tilemap-flip.esscene \
          ESTELLA_VERIFY_MANIFEST=/scenes/tilemap-flip.textures.json \
          ESTELLA_VERIFY_W=256 ESTELLA_VERIFY_H=256 ESTELLA_VERIFY_STEPS=2 \
          'ESTELLA_VERIFY_EXPECT=[{"x":0.40,"y":0.36,"rgb":[255,0,0]},{"x":0.60,"y":0.36,"rgb":[0,255,0]},{"x":0.40,"y":0.58,"rgb":[0,0,255]},{"x":0.60,"y":0.58,"rgb":[255,255,0]}]'
        # Tiled tile (GID) object: an object-layer object with a gid renders as a
        # positioned Sprite (bottom-left anchor, tileset UV) — the green tile centered.
        run_scene tilemap-gidobj \
          ESTELLA_VERIFY_SCENE=/scenes/tilemap-gidobj.esscene \
          ESTELLA_VERIFY_MANIFEST=/scenes/tilemap-gidobj.textures.json \
          ESTELLA_VERIFY_W=256 ESTELLA_VERIFY_H=256 ESTELLA_VERIFY_STEPS=10 \
          'ESTELLA_VERIFY_EXPECT=[{"x":0.5,"y":0.5,"rgb":[0,255,0],"tol":40},{"x":0.5,"y":0.12,"rgb":[0,0,0],"tol":30}]'
        # Parallax on a cached-chunk tilemap: the camera moves while the layer
        # model is untouched, so only the per-frame origin/parallax merge (not a
        # revision-bump rebuild) can place the tiles — guards against baking
        # camera-dependent offsets into the chunk cache.
        run_scene tilemap-parallax \
          ESTELLA_VERIFY_SCENE=/scenes/tilemap-parallax.esscene \
          ESTELLA_VERIFY_MANIFEST=/scenes/tilemap-flip.textures.json \
          ESTELLA_VERIFY_W=256 ESTELLA_VERIFY_H=256 ESTELLA_VERIFY_STEPS=2 \
          'ESTELLA_VERIFY_MOVE={"component":"Camera","to":[48,-16],"steps":3}' \
          'ESTELLA_VERIFY_EXPECT=[{"x":0.30,"y":0.40,"rgb":[255,0,0]},{"x":0.10,"y":0.40,"rgb":[0,0,0],"tol":20},{"x":0.50,"y":0.40,"rgb":[0,255,0]}]'
        # BitmapText's first pixel coverage: a 2-glyph synthetic .fnt atlas
        # (red A, green B) pins glyph layout, atlas UV orientation and the
        # one-DrawCommand-per-text path.
        run_scene bitmaptext \
          ESTELLA_VERIFY_SCENE=/scenes/bitmaptext.esscene \
          ESTELLA_VERIFY_W=256 ESTELLA_VERIFY_H=256 ESTELLA_VERIFY_STEPS=3 \
          'ESTELLA_VERIFY_EXPECT=[{"x":0.40,"y":0.5,"rgb":[255,0,0],"tol":20},{"x":0.60,"y":0.5,"rgb":[0,255,0],"tol":20},{"x":0.5,"y":0.15,"rgb":[0,0,0],"tol":20}]'
        run_scene ui-mask \
          ESTELLA_VERIFY_SCENE=/scenes/ui-list-mask.esscene \
          ESTELLA_VERIFY_MANIFEST=/scenes/ui-list-mask.textures.json \
          ESTELLA_VERIFY_W=800 ESTELLA_VERIFY_H=600 \
          'ESTELLA_VERIFY_EXPECT=[{"x":0.5,"y":0.5,"rgb":[255,0,0],"tol":60},{"x":0.9,"y":0.5,"rgb":[0,0,255],"tol":60},{"x":0.5,"y":0.85,"rgb":[0,0,255],"tol":60},{"x":0.5,"y":0.15,"rgb":[0,0,255],"tol":60}]'
        # Camera.cullingMask over sorting layers, for world content AND for UI —
        # whose `layer` encodes tree order, so it belongs to its Canvas' layer
        # instead. Layers 1 (the Canvas) and 2 (blue) are cleared from the mask, so
        # only green and yellow survive; unmasked, the full-screen HUD covers both.
        run_scene camera-culling \
          ESTELLA_VERIFY_PLAY=1 \
          ESTELLA_VERIFY_SCENE=/scenes/camera-culling.esscene \
          ESTELLA_VERIFY_MANIFEST=/scenes/camera-culling.textures.json \
          ESTELLA_VERIFY_W=320 ESTELLA_VERIFY_H=180 ESTELLA_VERIFY_STEPS=4 \
          'ESTELLA_VERIFY_EXPECT=[{"x":0.25,"y":0.5,"rgb":[0,255,0],"tol":30},{"x":0.75,"y":0.5,"rgb":[255,255,0],"tol":30}]'
        # Where the UI layout box SITS. The camera is driven away from the origin
        # at runtime, so the box moves without resizing: the unparented Canvas
        # (a screen root) must travel with it — red/green stay in their quadrants —
        # while the Canvas parented to a world entity must not, landing blue at the
        # anchor's own world position. Before screen roots existed the whole HUD
        # stayed at the origin and this frame came back black.
        run_scene ui-screen-root \
          ESTELLA_VERIFY_PLAY=1 \
          ESTELLA_VERIFY_SCENE=/scenes/ui-screen-root.esscene \
          ESTELLA_VERIFY_MANIFEST=/scenes/ui-screen-root.textures.json \
          ESTELLA_VERIFY_W=640 ESTELLA_VERIFY_H=360 ESTELLA_VERIFY_STEPS=4 \
          'ESTELLA_VERIFY_MOVE={"component":"Camera","to":[5000,-800],"steps":4}' \
          'ESTELLA_VERIFY_EXPECT=[{"x":0.25,"y":0.25,"rgb":[255,0,0],"tol":30},{"x":0.75,"y":0.75,"rgb":[0,255,0],"tol":30},{"x":0.75,"y":0.25,"rgb":[0,0,255],"tol":30},{"x":0.25,"y":0.75,"rgb":[0,0,0],"tol":30}]'
        # Y-sort: same scene twice — mask on flips the overlap to the lower
        # (higher-Y-key) entity; mask off preserves submission order. Both
        # asserted so neither path can silently regress.
        run_scene ysort-on \
          ESTELLA_VERIFY_YSORT=1 \
          ESTELLA_VERIFY_SCENE=/scenes/ysort.esscene \
          ESTELLA_VERIFY_MANIFEST=/scenes/ysort.textures.json \
          ESTELLA_VERIFY_W=256 ESTELLA_VERIFY_H=256 ESTELLA_VERIFY_STEPS=2 \
          'ESTELLA_VERIFY_EXPECT=[{"x":0.5,"y":0.5,"rgb":[0,255,0],"tol":30},{"x":0.5,"y":0.25,"rgb":[255,0,0],"tol":30},{"x":0.5,"y":0.75,"rgb":[0,255,0],"tol":30}]'
        run_scene ysort-off \
          ESTELLA_VERIFY_SCENE=/scenes/ysort.esscene \
          ESTELLA_VERIFY_MANIFEST=/scenes/ysort.textures.json \
          ESTELLA_VERIFY_W=256 ESTELLA_VERIFY_H=256 ESTELLA_VERIFY_STEPS=2 \
          'ESTELLA_VERIFY_EXPECT=[{"x":0.5,"y":0.5,"rgb":[255,0,0],"tol":30}]'
        # Depth layers (2.5D): same scene twice, one project setting apart. The
        # near sprite is in the LOWER layer and both merge into ONE draw call, so
        # inside the batch the order is fixed by index — no amount of sorting can
        # produce the depth answer, which is what makes the pair discriminating.
        run_scene depth-on \
          ESTELLA_VERIFY_DEPTH_LAYERS=6 \
          ESTELLA_VERIFY_SCENE=/scenes/depth-layers.esscene \
          ESTELLA_VERIFY_MANIFEST=/scenes/depth-layers.textures.json \
          'ESTELLA_VERIFY_EXPECT=[{"x":0.573,"y":0.5,"rgb":[255,0,0],"tol":60}]'
        run_scene depth-off \
          ESTELLA_VERIFY_SCENE=/scenes/depth-layers.esscene \
          ESTELLA_VERIFY_MANIFEST=/scenes/depth-layers.textures.json \
          'ESTELLA_VERIFY_EXPECT=[{"x":0.573,"y":0.5,"rgb":[0,0,255],"tol":60}]'
        # Motion trail: move a TrailRenderer entity across the frame in play mode,
        # asserting the ribbon rasterizes as a green band (head/mid/tail) with black
        # above it — the CPU-ribbon-through-the-batch-face path.
        run_scene trail \
          ESTELLA_VERIFY_PLAY=1 \
          ESTELLA_VERIFY_SCENE=/scenes/trail.esscene \
          ESTELLA_VERIFY_MANIFEST=/scenes/trail.textures.json \
          ESTELLA_VERIFY_W=256 ESTELLA_VERIFY_H=256 \
          'ESTELLA_VERIFY_TRAIL={"from":[-200,0],"to":[200,0],"steps":20}' \
          'ESTELLA_VERIFY_EXPECT=[{"x":0.80,"y":0.5,"rgb":[0,255,0],"tol":50},{"x":0.5,"y":0.5,"rgb":[0,255,0],"tol":50},{"x":0.25,"y":0.5,"rgb":[0,255,0],"tol":60},{"x":0.5,"y":0.15,"rgb":[0,0,0],"tol":30}]'
        # Linear-light pipeline (colorSpace: 'linear'). The lit falloff moves 52
        # to 125 (perceptually-uniform light); the mid-gray texture must ROUND-TRIP
        # exactly (sRGB store → hw decode → blit encode = identity) — a missing
        # sRGB upload variant would read ~187, so tol 6 is a hard discriminator.
        run_scene linear-lit \
          ESTELLA_VERIFY_COLORSPACE=linear \
          ESTELLA_VERIFY_SCENE=/scenes/mat-lit-point.esscene \
          ESTELLA_VERIFY_MANIFEST=/scenes/mat-lit-point.textures.json \
          ESTELLA_VERIFY_W=256 ESTELLA_VERIFY_H=256 ESTELLA_VERIFY_STEPS=2 \
          'ESTELLA_VERIFY_EXPECT=[{"x":0.5,"y":0.5,"rgb":[0,254,0],"tol":25},{"x":0.75,"y":0.5,"rgb":[0,125,0],"tol":25}]'
        run_scene linear-midtone \
          ESTELLA_VERIFY_COLORSPACE=linear \
          ESTELLA_VERIFY_SCENE=/scenes/srgb-midtone.esscene \
          ESTELLA_VERIFY_MANIFEST=/scenes/srgb-midtone.textures.json \
          ESTELLA_VERIFY_W=256 ESTELLA_VERIFY_H=256 ESTELLA_VERIFY_STEPS=2 \
          'ESTELLA_VERIFY_EXPECT=[{"x":0.5,"y":0.5,"rgb":[128,128,128],"tol":6}]'
        # Post-process chain guards — bloom's first CI pixel coverage. The gamma
        # scene pins the LDR multi-pass chain; the linear scene is the HDR
        # discriminator: threshold 1.5 sits above anything an 8-bit chain can
        # store, so glow OUTSIDE the sprite (x=0.64) proves over-range light
        # survived the float intermediates — the same scene blooms NOTHING in
        # gamma mode.
        run_scene bloom-ldr \
          ESTELLA_VERIFY_PLAY=1 \
          ESTELLA_VERIFY_SCENE=/scenes/bloom-ldr.esscene \
          ESTELLA_VERIFY_MANIFEST=/scenes/bloom-ldr.textures.json \
          ESTELLA_VERIFY_W=256 ESTELLA_VERIFY_H=256 ESTELLA_VERIFY_STEPS=10 \
          'ESTELLA_VERIFY_EXPECT=[{"x":0.61,"y":0.5,"rgb":[0,130,0],"tol":35},{"x":0.70,"y":0.5,"rgb":[0,32,0],"tol":25},{"x":0.85,"y":0.5,"rgb":[0,0,0],"tol":12}]'
        run_scene hdr-bloom \
          ESTELLA_VERIFY_PLAY=1 ESTELLA_VERIFY_COLORSPACE=linear \
          ESTELLA_VERIFY_SCENE=/scenes/hdr-bloom.esscene \
          ESTELLA_VERIFY_MANIFEST=/scenes/hdr-bloom.textures.json \
          ESTELLA_VERIFY_W=256 ESTELLA_VERIFY_H=256 ESTELLA_VERIFY_STEPS=10 \
          'ESTELLA_VERIFY_EXPECT=[{"x":0.5,"y":0.5,"rgb":[0,255,0],"tol":25},{"x":0.64,"y":0.5,"rgb":[0,255,0],"tol":35},{"x":0.85,"y":0.5,"rgb":[0,0,0],"tol":12}]'

    # The MCP surface itself, both hosts: the headless one (scene tools) and the
    # real app (project → scene → entity → save → play → hot reload). Both have
    # existed as scripts somebody ran by hand; nothing ran them.
    - name: Run MCP end-to-end
      working-directory: desktop
      env:
        ELECTRON_DISABLE_SANDBOX: '1'
      run: |
        xvfb-run -a node scripts/editor-mcp-e2e.mjs
        xvfb-run -a node scripts/editor-mcp-editor-e2e.mjs

    # The EDITOR's authoring surface, driven for real. The engine has had a pixel
    # gate for years; the editor had none, which is how depth layers shipped
    # reaching the play realm and neither the viewport nor a build. Each check
    # opens the app over MCP and asks a question only the running editor can
    # answer (does the project setting reach the viewport, does a click select
    # what is drawn on top, does the grid cover a perspective frame).
    - name: Run editor authoring checks
      working-directory: desktop
      env:
        ELECTRON_DISABLE_SANDBOX: '1'
      run: xvfb-run -a node scripts/editor-checks/run.mjs

    # The golden corpus, packaged and opened the way a player opens it. Exporting
    # was checked and the engine was checked; the package itself never was, which
    # is where a wrong export default or a path that only resolves in the editor
    # survives every other green check and ships.
    - name: Launch the golden packages (PR tier)
      env:
        ELECTRON_DISABLE_SANDBOX: '1'
      run: xvfb-run -a node tools/verify-golden.mjs --tier pr

    # The SAME pixel assertions on the WebGPU backend — Dawn renders through the
    # bundled SwiftShader Vulkan (--use-webgpu-adapter=swiftshader), so a GPU-less
    # runner verifies the second backend for real: WGSL twins, the reflected
    # material path, the editor grid, and the async readback (material preview).
    - name: Run headless verify scenes (WebGPU / SwiftShader)
      working-directory: desktop
      env:
        ELECTRON_DISABLE_SANDBOX: '1'
        ESTELLA_VERIFY_BACKEND: webgpu
        ESTELLA_VERIFY_WEBGPU_ADAPTER: swiftshader
      run: |
        run_scene() {
          echo "=== $1"
          shift
          env "$@" xvfb-run -a pnpm exec electron scripts/headless-verify.mjs
        }
        run_scene webgpu-sprite-grid ESTELLA_VERIFY_GRID=64 ESTELLA_VERIFY_STEPS=3
        run_scene webgpu-parallax-shape \
          ESTELLA_VERIFY_SCENE=/scenes/parallax-shape.esscene \
          ESTELLA_VERIFY_MANIFEST=/scenes/parallax-shape.textures.json \
          ESTELLA_VERIFY_STEPS=4 \
          'ESTELLA_VERIFY_EXPECT=[{"x":0.5,"y":0.5,"rgb":[0,255,0],"tol":40},{"x":0.25,"y":0.5,"rgb":[255,0,0],"tol":40}]'
        # Tolerances tightened after the readback fix (force-color-profile=srgb):
        # capturePage was display-referred, so wide-gamut machines read a fake
        # "R/B bleed" here. Deterministic now — GL and WebGPU read identical.
        run_scene webgpu-mat-lit-point \
          ESTELLA_VERIFY_SCENE=/scenes/mat-lit-point.esscene \
          ESTELLA_VERIFY_MANIFEST=/scenes/mat-lit-point.textures.json \
          ESTELLA_VERIFY_W=256 ESTELLA_VERIFY_H=256 ESTELLA_VERIFY_STEPS=2 \
          'ESTELLA_VERIFY_EXPECT=[{"x":0.5,"y":0.5,"rgb":[0,253,0],"tol":25},{"x":0.75,"y":0.5,"rgb":[0,52,0],"tol":25}]'
        run_scene webgpu-mat-tint-preview \
          ESTELLA_VERIFY_SCENE=/scenes/mat-tint.esscene \
          ESTELLA_VERIFY_MANIFEST=/scenes/mat-tint.textures.json \
          ESTELLA_VERIFY_W=256 ESTELLA_VERIFY_H=256 ESTELLA_VERIFY_STEPS=2 \
          'ESTELLA_VERIFY_EXPECT=[{"x":0.5,"y":0.5,"rgb":[255,0,0],"tol":40}]' \
          'ESTELLA_VERIFY_PREVIEW={"w":64,"h":64,"rgb":[255,0,0],"tol":45}'
        run_scene webgpu-ysort \
          ESTELLA_VERIFY_YSORT=1 \
          ESTELLA_VERIFY_SCENE=/scenes/ysort.esscene \
          ESTELLA_VERIFY_MANIFEST=/scenes/ysort.textures.json \
          ESTELLA_VERIFY_W=256 ESTELLA_VERIFY_H=256 ESTELLA_VERIFY_STEPS=2 \
          'ESTELLA_VERIFY_EXPECT=[{"x":0.5,"y":0.5,"rgb":[0,255,0],"tol":30},{"x":0.5,"y":0.25,"rgb":[255,0,0],"tol":30},{"x":0.5,"y":0.75,"rgb":[0,255,0],"tol":30}]'
        run_scene webgpu-trail \
          ESTELLA_VERIFY_PLAY=1 \
          ESTELLA_VERIFY_SCENE=/scenes/trail.esscene \
          ESTELLA_VERIFY_MANIFEST=/scenes/trail.textures.json \
          ESTELLA_VERIFY_W=256 ESTELLA_VERIFY_H=256 \
          'ESTELLA_VERIFY_TRAIL={"from":[-200,0],"to":[200,0],"steps":20}' \
          'ESTELLA_VERIFY_EXPECT=[{"x":0.80,"y":0.5,"rgb":[0,255,0],"tol":50},{"x":0.5,"y":0.5,"rgb":[0,255,0],"tol":50},{"x":0.25,"y":0.5,"rgb":[0,255,0],"tol":60},{"x":0.5,"y":0.15,"rgb":[0,0,0],"tol":30}]'
        # Linear pipeline on the second backend — same expectations as the GL
        # linear scenes (backends are each other's gold). The mid-gray round-trip
        # additionally proves the ENGINE-SIDE sRGB upload promotion: on WebGPU
        # every texture uploads through rm_createTexture, so a missing SRGB8A8
        # promotion would read ~187 here while GL (raw-GL upload path) stayed 128.
        run_scene webgpu-linear-lit \
          ESTELLA_VERIFY_COLORSPACE=linear \
          ESTELLA_VERIFY_SCENE=/scenes/mat-lit-point.esscene \
          ESTELLA_VERIFY_MANIFEST=/scenes/mat-lit-point.textures.json \
          ESTELLA_VERIFY_W=256 ESTELLA_VERIFY_H=256 ESTELLA_VERIFY_STEPS=2 \
          'ESTELLA_VERIFY_EXPECT=[{"x":0.5,"y":0.5,"rgb":[0,254,0],"tol":25},{"x":0.75,"y":0.5,"rgb":[0,125,0],"tol":25}]'
        run_scene webgpu-linear-midtone \
          ESTELLA_VERIFY_COLORSPACE=linear \
          ESTELLA_VERIFY_SCENE=/scenes/srgb-midtone.esscene \
          ESTELLA_VERIFY_MANIFEST=/scenes/srgb-midtone.textures.json \
          ESTELLA_VERIFY_W=256 ESTELLA_VERIFY_H=256 ESTELLA_VERIFY_STEPS=2 \
          'ESTELLA_VERIFY_EXPECT=[{"x":0.5,"y":0.5,"rgb":[128,128,128],"tol":6}]'
        # Bloom on the second backend — measured byte-identical to GL after the
        # bind-group eviction fix (stale-id aliasing silently zeroed the WGSL
        # chain's params); these scenes keep that regression impossible to miss.
        run_scene webgpu-bloom-ldr \
          ESTELLA_VERIFY_PLAY=1 \
          ESTELLA_VERIFY_SCENE=/scenes/bloom-ldr.esscene \
          ESTELLA_VERIFY_MANIFEST=/scenes/bloom-ldr.textures.json \
          ESTELLA_VERIFY_W=256 ESTELLA_VERIFY_H=256 ESTELLA_VERIFY_STEPS=10 \
          'ESTELLA_VERIFY_EXPECT=[{"x":0.61,"y":0.5,"rgb":[0,130,0],"tol":35},{"x":0.70,"y":0.5,"rgb":[0,32,0],"tol":25},{"x":0.85,"y":0.5,"rgb":[0,0,0],"tol":12}]'
        run_scene webgpu-hdr-bloom \
          ESTELLA_VERIFY_PLAY=1 ESTELLA_VERIFY_COLORSPACE=linear \
          ESTELLA_VERIFY_SCENE=/scenes/hdr-bloom.esscene \
          ESTELLA_VERIFY_MANIFEST=/scenes/hdr-bloom.textures.json \
          ESTELLA_VERIFY_W=256 ESTELLA_VERIFY_H=256 ESTELLA_VERIFY_STEPS=10 \
          'ESTELLA_VERIFY_EXPECT=[{"x":0.5,"y":0.5,"rgb":[0,255,0],"tol":25},{"x":0.64,"y":0.5,"rgb":[0,255,0],"tol":35},{"x":0.85,"y":0.5,"rgb":[0,0,0],"tol":12}]'

  # The native runtime, judged by pixels on a machine with no GPU.
  #
  # Until the desktop host existed the native runtime could only be checked on a
  # simulator or a phone — where an OS dialog over the frame once made a dead app
  # look healthy. A Linux runner IS one of the platforms it ships to, so it
  # packages a real project the way the Package dialog does, runs the assembled
  # app under a virtual display on a software Vulkan driver, and reads the frame.
  desktop-linux:
    name: Desktop host (Linux) + pixels
    runs-on: ubuntu-latest
    # clang, not the runner's default gcc: Dawn ships a C++20 module target, and
    # CMake refuses to generate for a compiler it cannot scan the import graph
    # with. It is also what the other two desktops compile with.
    env:
      CC: clang
      CXX: clang++
    # The first run on a new dependency pin builds Dawn, which is tens of minutes;
    # after that the cache makes it a compile of the host alone.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup

      # The SDK bundle is compiled into the host binary.
      - name: Build SDK
        run: pnpm --filter ./sdk build

      - name: Read the native dependency pins
        id: pins
        run: node build-tools/cli.js native --deps-cache-key linux >> "$GITHUB_OUTPUT"

      - name: Cache the pinned checkouts + Dawn build
        uses: actions/cache@v4
        with:
          path: build/native-deps
          key: ${{ steps.pins.outputs.key }}

      # Vulkan for Dawn, X11/Wayland for the window, fontconfig and libcurl for the
      # per-OS seam, and the software driver + virtual display that let a runner
      # with neither a GPU nor a screen answer a question about pixels.
      - name: Set up the Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libvulkan-dev mesa-vulkan-drivers xvfb \
            libx11-dev libx11-xcb-dev libxcb1-dev libxext-dev libxfixes-dev libxrandr-dev \
            libxi-dev libxcursor-dev libxinerama-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libdbus-1-dev libibus-1.0-dev libudev-dev libdrm-dev libgbm-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libasound2-dev libpulse-dev libfontconfig1-dev libcurl4-openssl-dev

      - name: Fetch Dawn + QuickJS + SDL at their pinned commits
        run: node build-tools/cli.js native --fetch-deps

      - name: Build the Linux host and its runtime template
        run: node build-tools/cli.js native --target linux

      - name: A game packaged from it renders
        run: |
          ls -l /usr/share/vulkan/icd.d/ || true
          xvfb-run -a --server-args="-screen 0 1280x720x24" node tools/verify-desktop-render.mjs --examples hello-world
