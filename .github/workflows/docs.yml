name: Deploy Documentation

on:
  push:
    tags:
      - 'docs-v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      # TypeDoc (starlight-typedoc) compiles sdk/src against sdk/tsconfig.json,
      # which resolves ambient types (@types/node, minigame-api-typings) from
      # the sdk workspace's node_modules — install the workspace first.
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      - name: Build Doxygen API Docs
        working-directory: docs
        run: |
          export ESTELLA_VERSION=$(node -p "require('../desktop/package.json').version")
          doxygen Doxyfile

      - name: Install Astro Dependencies
        working-directory: docs/astro
        run: npm install

      - name: Verify doc API imports match the SDK exports
        working-directory: docs/astro
        run: npm run verify:imports

      - name: Build Astro Site
        working-directory: docs/astro
        run: npm run build

      - name: Merge Documentation
        run: |
          mkdir -p docs/dist/docs/api
          cp -r docs/astro/dist/* docs/dist/docs/
          cp -r docs/api/html docs/dist/docs/api/
          cp docs/landing/index.html docs/dist/index.html
          cp docs/landing/editor-screenshot.png docs/dist/editor-screenshot.png
          cp docs/landing/robots.txt docs/dist/robots.txt
          cp docs/landing/og-image.png docs/dist/og-image.png
          echo 'estellaengine.com' > docs/dist/CNAME
          touch docs/dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
