name: Editor spatial acceptance

on:
  workflow_dispatch:
    inputs:
      artifact-run:
        description: Build run with successful Web artifacts from identical engine and SDK sources
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  spatial:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: spatial
            artifact: gizmo-planes-editor-checks
          - suite: interaction
            artifact: gizmo-interaction-editor-checks
          - suite: legacy-2d
            artifact: gizmo-legacy-2d-editor-checks
          - suite: regression
            artifact: gizmo-regression-editor-checks
          - suite: navigation
            artifact: navigation-inspector-editor-checks
    env:
      ESTELLA_WIN_W: '1480'
      ESTELLA_WIN_H: '920'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/editor-checkout
        with:
          ssh-key: ${{ secrets.EDITOR_SSH_KEY }}
          history: full
      - uses: ./.github/actions/setup
      - name: Require identical engine and SDK sources and a successful Web build
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN: ${{ inputs.artifact-run }}
        run: |
          [[ "$ARTIFACT_RUN" =~ ^[0-9]+$ ]]
          source=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN" --jq .head_sha)
          git diff --exit-code "$source" HEAD -- src sdk native include CMakeLists.txt package.json toolchain.manifest.json build-tools pipeline
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN/jobs?per_page=100" --jq '[.jobs[] | select(.name == "Web (Emscripten)" and .conclusion == "success")] | length')
          test "$passed" -eq 1
          gh run download "$ARTIFACT_RUN" --repo "$GITHUB_REPOSITORY" --name wasm-web --dir build/wasm/web
      - name: Install the virtual display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libasound2t64 libgtk-3-0t64 libgbm1
      - name: Build the editor against the measured runtime
        run: |
          pnpm --filter ./sdk build
          mkdir -p desktop/public/wasm
          cp build/wasm/web/* desktop/public/wasm/
          pnpm --dir desktop exec vite build
      - name: Check live agent route inspection
        if: matrix.suite == 'navigation'
        run: node tools/verify-navigation-inspector.mjs
      - name: Install headless Chromium for the navigation workshop
        if: matrix.suite == 'navigation'
        run: pnpm exec playwright install --with-deps chromium
      - name: Check the exported building navigation workshop
        if: matrix.suite == 'navigation'
        run: |
          node pipeline/bin/estella.mjs export examples/navigation-workshop --platform web --out output/navigation-workshop-web
          node tools/verify-navigation-workshop.mjs --dir output/navigation-workshop-web --out output/navigation-workshop-ci
      - name: Check trusted spatial gestures and undo
        if: matrix.suite == 'spatial'
        run: node tools/verify-gizmo-planes.mjs
      - name: Check handle occlusion against opaque scene depth
        if: matrix.suite == 'spatial'
        run: node tools/verify-gizmo-occlusion.mjs
      - name: Check transform hover without scene changes
        if: matrix.suite == 'interaction'
        run: node tools/verify-gizmo-hover.mjs
      - name: Check origins and universal gestures with undo and cancel
        if: matrix.suite == 'interaction'
        run: node tools/verify-gizmo-origins.mjs
      - name: Compare legacy 2D project widgets with their previous editor
        if: matrix.suite == 'legacy-2d'
        run: node tools/verify-gizmo-legacy-2d.mjs
      - name: Run existing gizmo authoring checks
        if: matrix.suite == 'regression'
        shell: bash
        working-directory: desktop
        env:
          ESTELLA_MCP_EDITOR_VISIBLE: '1'
          OUT: ${{ github.workspace }}/output/gizmo-regression-ci
          ELECTRON_DISABLE_SANDBOX: '1'
        run: |
          mkdir -p "$OUT"
          xvfb-run -a --server-args="-screen 0 1920x1080x24" node scripts/editor-checks/run.mjs gizmo- | tee "$OUT/checks.log"
      - name: Keep spatial acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            output/gizmo-planes-ci
            output/gizmo-occlusion-ci
            output/gizmo-hover-ci
            output/gizmo-origins-ci
            output/gizmo-legacy-2d-ci
            output/gizmo-regression-ci
            output/navigation-inspector-ci
            output/navigation-workshop-ci
          if-no-files-found: warn
          retention-days: 3
