name: Landscape brush acceptance

on:
  workflow_call:
    secrets:
      EDITOR_SSH_KEY:
        required: true
  workflow_dispatch:
    inputs:
      build_run:
        description: Master Build run with the Web runtime to test
        type: string
        required: true
      current_source:
        description: Test the current master editor and terrain SDK with a compatible recorded Web runtime
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  editor:
    name: Landscape brushes, splines and paint in the editor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Replays default to the original source. A current-source replay verifies all native runtime inputs first.
      - name: Identify the recorded build
        if: inputs.build_run
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run }}
        run: |
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" --jq 'select(.path == ".github/workflows/build.yml" and .head_branch == "master" and .event == "push") | .head_sha')
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.current_source && github.sha || steps.build.outputs.sha || github.sha }}
      - name: Verify that the recorded runtime matches the current Landscape sources
        if: inputs.current_source
        env:
          BUILD_SHA: ${{ steps.build.outputs.sha }}
        run: |
          test "$GITHUB_REF" = refs/heads/master
          git fetch --no-tags --depth=1 origin "$BUILD_SHA"
          # These files are tested from HEAD below or have no effect on the native Web binary.
          git diff --quiet --ignore-submodules=none "$BUILD_SHA" HEAD -- . \
            ':(exclude)desktop' ':(exclude)sdk/src/terrain/*.ts' ':(exclude)sdk/tests/**' \
            ':(exclude)sdk/src/scene/scene.ts' ':(exclude)sdk/src/assetTypes.ts' ':(exclude)sdk/src/runtime/planWorkerBundle.generated.ts' \
            ':(exclude)sdk/etc/*.api.md' ':(exclude)docs/astro/src/data/*.generated.json' ':(exclude)pipeline/src/assets/assetDb.ts' \
            ':(exclude)tools/assetMetaTable.js' ':(exclude)tools/check-corpus-authoring.mjs' \
            ':(exclude)changelog.d/**' ':(exclude).github/workflows/landscape-brush.yml'
      - uses: ./.github/actions/editor-checkout
        with:
          ssh-key: ${{ secrets.EDITOR_SSH_KEY }}
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: wasm-web
          path: build/wasm/web
          run-id: ${{ inputs.build_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Build the editor with the recorded runtime
        run: |
          pnpm --filter ./sdk build
          mkdir -p desktop/public/wasm
          cp build/wasm/web/* desktop/public/wasm/
          pnpm --dir desktop exec vite build
      - name: Check Landscape brushes and splines in the editor
        env:
          OUT: ${{ runner.temp }}/landscape-captures
        timeout-minutes: 6
        working-directory: desktop
        run: |
          # On a clean install the first require downloads Electron and prints its progress.
          node -e "require('electron')"
          sandbox=node_modules/electron/dist/chrome-sandbox
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
          mkdir -p "$OUT"
          xvfb-run -a node scripts/editor-checks/run.mjs landscape-brush landscape-splines
      - name: Check Landscape weight painting in the editor
        env:
          OUT: ${{ runner.temp }}/landscape-captures
        timeout-minutes: 4
        working-directory: desktop
        run: xvfb-run -a node scripts/editor-checks/run.mjs landscape-paint
      - name: Verify water zone authoring and water-only wireframes
        if: github.event_name != 'workflow_dispatch' || inputs.current_source
        working-directory: desktop
        env:
          OUT: ${{ runner.temp }}/landscape-captures
        run: xvfb-run -a node scripts/editor-checks/run.mjs water-zone-mesh
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.current_source) }}
        with:
          name: water-zone-inspector
          path: ${{ runner.temp }}/landscape-captures/water-zone-*.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: landscape-spline-viewport
          path: ${{ runner.temp }}/landscape-captures/landscape-splines.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: landscape-paint-viewport
          path: ${{ runner.temp }}/landscape-captures/landscape-paint.png
          if-no-files-found: ignore
