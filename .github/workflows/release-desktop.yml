name: Release Desktop App

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    strategy:
      fail-fast: false
      # Serialize the platforms: electron-builder's GitHub publisher creates the draft
      # release lazily, so running all three in parallel races and produces duplicate
      # drafts with the artifacts split between them. With one at a time, the first job
      # creates the draft and the rest find and upload to it.
      max-parallel: 1
      # Windows + macOS only — the Linux AppImage is dropped from releases
      # until there is real demand for it.
      matrix:
        platform:
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 5.0.0

      - name: Setup ccache
        if: matrix.platform != 'windows-latest'
        uses: hendrikmuhs/ccache-action@v1.2.20
        with:
          key: ${{ matrix.platform }}-release
          max-size: 1G

      - name: Install dependencies
        run: pnpm install

      - name: Build engine and sync to desktop
        run: node build-tools/cli.js build -t all

      - name: Package engine source for toolchain
        run: node build-tools/cli.js toolchain

      - name: Build SDK
        run: pnpm --filter ./sdk build

      - name: Build desktop renderer + main
        run: pnpm --filter ./desktop build

      - name: Package and publish desktop app
        run: pnpm --filter ./desktop exec electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
