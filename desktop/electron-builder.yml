# electron-builder config — Estella Editor.
# The renderer (dist/) and Electron main+preload (dist-electron/) are produced by
# `vite build` (see vite.config.ts). `pnpm --filter @estella/editor dist` builds
# installers; `dist:dir` produces an unpacked app for local smoke testing.
appId: com.estellaengine.editor
productName: Estella Editor
# The package name is scoped (@estella/editor); pin a clean binary name so the Linux
# AppImage builder doesn't choke on the '@' / '/'.
executableName: estella-editor
directories:
  output: release
  # App icons. The default buildResources dir (`build`) is gitignored, so the
  # committed icons live here; electron-builder auto-detects icon.ico (Windows)
  # and icon.png (macOS → generated .icns, Linux) from this directory.
  buildResources: icons
files:
  - dist/**
  # Stale example zips from the retired zip-examples task (gitignored, may
  # linger in contributors' public/ and ride into dist/) must not ship.
  - "!dist/examples/**"
  - dist-electron/**
  - package.json
# Trees the runtime consumes as REAL files, not through Electron's patched fs:
#   - esbuild runs as a native subprocess (project scripts, exports) — its own
#     binary, the prebuilt realm-host bundles it re-bundles for exports, and the
#     SDK dist that inlined (playable/wechat) bundles alias `esengine` to must
#     all be readable outside app.asar;
#   - the engine wasm runtime is staged into play realms / exports by recursive
#     directory copy, which cannot source from inside an asar.
asarUnpack:
  - "**/node_modules/{esbuild,@esbuild}/**"
  # ffmpeg (video cook) spawns as a subprocess — executables cannot run from
  # inside the asar (videoCook resolves the app.asar.unpacked twin).
  - "**/node_modules/ffmpeg-static/**"
  - dist-electron/hosts/**
  # The MCP front: an MCP client runs this with plain node (node cannot read
  # inside an asar), which spawns/attaches the editor as the MCP host.
  - dist-electron/mcp/**
  # The TypeScript language service reads its own lib.*.d.ts off disk; keeping
  # the package unpacked also keeps `getDefaultLibFilePath` returning a path that
  # exists for anything that later shells out to it.
  - "**/node_modules/typescript/**"
  - "**/node_modules/esengine/dist/**"
  - dist/wasm/**
  - dist/wasm-wechat/**
# The Basis KTX2 encoder lives at the monorepo root (build-tools/basis).
# cookAssets imports it via `../../build-tools/basis` relative to the bundled
# main; once packaged, main sits at resources/app.asar/dist-electron/, so that
# path resolves to resources/build-tools/basis. Ship it there as an extra
# resource (outside the asar, so its native wasm resolves via import.meta.url).
extraResources:
  - from: ../build-tools/basis
    to: build-tools/basis
  # The SDK's TypeScript declarations, shipped as a real resource so a project's
  # `.esengine/sdk` types mirror can be staged on open (see electron/main.ts →
  # syncSdkTypes). electron-builder strips *.d.ts from node_modules by default
  # (app-builder-lib excludedExts), so node_modules/esengine/dist carries the
  # SDK's .js — used by the play runtime and esbuild aliasing — but NONE of its
  # .d.ts; without this the IDE cannot resolve `esengine` in a shipped build
  # (the real root cause behind issue #49's staging error). SDK dist is built
  # before packaging (release-desktop.yml "Build SDK").
  - from: ../sdk/dist
    to: sdk-types
    filter:
      - "**/*.d.ts"
  # New-project templates: the bundled blank-slate starter(s) plus the sample
  # projects, staged as real directories (createFromTemplate copies a template
  # with fs.cp, which cannot source from inside the asar). The launcher reads
  # resources/templates then resources/examples — see electron/launcher.ts.
  # The dist-* exclusions matter as much as the others: a package a developer
  # exported (dist-playable/, dist-wechat/, dist-game/ … — `dist-<platform>`) sits
  # inside the example it came from, and `**/dist/**` never matched those names, so
  # local export output rode into the installer.
  - from: templates
    to: templates
    filter:
      - "**/*"
      - "!**/.esengine/**"
      - "!**/node_modules/**"
      - "!**/dist/**"
      - "!**/dist-*/**"
  - from: ../examples
    to: examples
    filter:
      - "**/*"
      - "!**/.esengine/**"
      - "!**/node_modules/**"
      - "!**/dist/**"
      - "!**/dist-*/**"
win:
  target: nsis
# Assisted (non-oneClick) installer: electron-builder derives the oneClick
# install dir from the SANITIZED PACKAGE NAME (@estella/editor -> a literal
# `@estellaeditor` folder under LocalAppData\Programs — issue #3100); the
# assisted flow uses productName ("Estella Editor") and lets the user pick.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
mac:
  # arm64 only: a universal build would merge an x64 slice, but pnpm 10 installs just
  # the host-arch esbuild native binary, so the x64 slice would ship a broken esbuild
  # (and electron-builder rejects the identical-across-arch binary). Intel-mac support
  # would need the darwin-x64 esbuild binary installed for a separate x64 dmg.
  #
  # The zip is not a second thing to download — it is what Squirrel.Mac installs
  # from. An in-place update swaps in a whole signed .app, which a dmg is not, so a
  # release carrying only the dmg leaves latest-mac.yml naming a file nobody shipped
  # and every macOS auto-update fails at the last step.
  #
  # Everything else macOS signing needs is already the default: a hardened runtime,
  # entitlements granting the JIT the engine's wasm runs on, and notarization
  # whenever APPLE_ID and friends are in the environment (skipped with a warning
  # when they are not, which is what a local `pnpm dist` wants).
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  category: public.app-category.developer-tools
linux:
  target: AppImage
  category: Development
# GitHub releases are created as drafts: the per-platform CI jobs upload their
# artifacts to one draft release, then a maintainer reviews and publishes it.
# Switch to `release` for direct publishing.
publish:
  provider: github
  owner: esengine
  repo: estella
  releaseType: draft
