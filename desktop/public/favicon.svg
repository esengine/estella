<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <title>Estella</title>
  <!-- App chip: near-black rounded tile, a soft azure halo, and a faceted four-point star. -->
  <defs>
    <filter id="halo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4.2"/>
    </filter>
    <clipPath id="tile"><rect width="100" height="100" rx="22"/></clipPath>
  </defs>
  <rect width="100" height="100" rx="22" fill="#101219"/>
  <g clip-path="url(#tile)">
    <g transform="translate(50 50) scale(0.74) translate(-50 -50)">
      <path d="M50 6 L58 42 L94 50 L58 58 L50 94 L42 58 L6 50 L42 42 Z" fill="#2f88d6" filter="url(#halo)" opacity="0.55"/>
      <path d="M50 50 L42 42 L50 6 L58 42 Z"  fill="#4aa6ec"/>
      <path d="M50 50 L58 42 L94 50 L58 58 Z" fill="#2f88d6"/>
      <path d="M50 50 L58 58 L50 94 L42 58 Z" fill="#1c5988"/>
      <path d="M50 50 L42 58 L6 50 L42 42 Z"  fill="#2c7cc0"/>
      <g stroke="#0a1826" stroke-width="0.7" stroke-linecap="round" opacity="0.5">
        <line x1="50" y1="50" x2="42" y2="42"/><line x1="50" y1="50" x2="58" y2="42"/>
        <line x1="50" y1="50" x2="58" y2="58"/><line x1="50" y1="50" x2="42" y2="58"/>
      </g>
      <path d="M42 42 L50 50 L58 42" fill="none" stroke="#9fd2f7" stroke-width="0.7" opacity="0.6"/>
    </g>
  </g>
</svg>
