<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Mirror the editor shell's policy so popped-out panels can render the same
         asset thumbnails (estella:/data:/blob:) and copied-in styles (unsafe-inline). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: estella:; media-src 'self' estella:; font-src 'self' data:; connect-src 'self' ws: estella:; worker-src 'self' blob:; frame-src 'self' estella:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estella</title>
    <!-- Host page for a popped-out dock panel (dockview addPopoutGroup). Intentionally
         script-free: the panel's DOM is re-parented here, but its React tree and all
         editor state stay in the opener window (same-origin window.open), so this page
         only needs to be a styled shell. dockview copies the opener's stylesheets in on
         load; the dark background avoids a white flash before that happens. -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0e121b;
        overflow: hidden;
      }
    </style>
  </head>
  <body></body>
</html>
