<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img"><defs><pattern id="crop" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#ef4444" fill-opacity="0.14"/><line x1="0" y1="0" x2="0" y2="7" stroke="#ef4444" stroke-width="1.4" stroke-opacity="0.55"/></pattern></defs><text x="320" y="22" fill="#c7cdd8" font-size="13" font-weight="600" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">A 16:9 design on a taller 4:3 screen</text><line x1="320" y1="40" x2="320" y2="228" stroke="#2b2f3a" stroke-width="1"/><text x="167" y="46" fill="#c7cdd8" font-size="12" font-weight="600" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">FixedWidth · Expand</text><rect x="92" y="58" width="150" height="14" fill="#22c55e" fill-opacity="0.22"/><rect x="92" y="156" width="150" height="14" fill="#22c55e" fill-opacity="0.22"/><rect x="92" y="72" width="150" height="84" fill="#3b82f6" fill-opacity="0.16" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 3"/><text x="167" y="118" fill="#aeb6c6" font-size="11" font-weight="600" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">design</text><rect x="92" y="58" width="150" height="112" rx="3" fill="none" stroke="#c7cdd8" stroke-width="1.6"/><text x="167" y="194" fill="#8b91a0" font-size="11" font-weight="600" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">reveals world above + below</text><text x="167" y="210" fill="#5f95d6" font-size="10" font-weight="600" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">(nothing cut off)</text><text x="490" y="46" fill="#c7cdd8" font-size="12" font-weight="600" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">FixedHeight · Shrink</text><rect x="390.5" y="58" width="199" height="112" fill="#3b82f6" fill-opacity="0.16"/><rect x="390.5" y="58" width="24.5" height="112" fill="url(#crop)"/><rect x="565" y="58" width="24.5" height="112" fill="url(#crop)"/><text x="490" y="118" fill="#aeb6c6" font-size="11" font-weight="600" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">design</text><rect x="415" y="58" width="150" height="112" rx="3" fill="none" stroke="#c7cdd8" stroke-width="1.6"/><text x="490" y="194" fill="#8b91a0" font-size="11" font-weight="600" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">crops the left + right</text><text x="490" y="210" fill="#d67d7d" font-size="10" font-weight="600" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">(screen always filled)</text></svg>