# The iOS app shell: signing + packaging around libestella_ios.a, which
# `node build-tools/cli.js native --target ios --dawn ... --quickjs ...` produces
# in build-native-ios/ (host + engine + QuickJS + Dawn, merged).
#
#   brew install xcodegen && cd native/ios && xcodegen && open EstellaiOS.xcodeproj
#
# Then pick your Team under Signing & Capabilities and Run on a device. The game
# (game.js) and its content ship as bundle resources, the way the APK ships them
# under assets/ — the host reads both through the same project-relative paths.
name: EstellaiOS

options:
  bundleIdPrefix: com.estella
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  EstellaiOS:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: ../host_js/game.js
        buildPhase: resources
        type: file
      - path: ../host_js/logo.png
        buildPhase: resources
        type: file
      # An exported project, staged by `cli native --target ios --content <dir>`.
      # A folder reference (not a group) so cooked subdirectories keep their
      # shape — the host reads Content/ first, the bundle root second.
      - path: Content
        buildPhase: resources
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.estella.EstellaiOS
        INFOPLIST_FILE: App/Info.plist
        # -ObjC keeps the view controller / app delegate classes in the static
        # library alive; the linker would otherwise drop TUs nothing references.
        OTHER_LDFLAGS: -ObjC -lc++
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_BITCODE: NO
        # arm64 only, devices and simulator alike: the CMake build and Dawn are
        # both arm64: a Release simulator build would otherwise also want x86_64,
        # which no slice provides. (An Intel-Mac simulator needs its own Dawn.)
        ARCHS: arm64
    dependencies:
      # An .xcframework, not a bare .a: device and simulator are different target
      # triples whose objects cannot link together, and Xcode picks the slice that
      # matches whatever the toolbar is pointed at. Build the simulator slice with
      # `cli native --target ios --simulator`.
      - framework: ../../build-native-ios/Estella.xcframework
        embed: false
      - sdk: UIKit.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: IOSurface.framework
      - sdk: CoreGraphics.framework
      - sdk: Foundation.framework
